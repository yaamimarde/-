name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: pharmaceutical_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Pharmaceutical.sln

      - name: Build
        run: dotnet build Pharmaceutical.sln --no-restore -c Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: "server=127.0.0.1;user=root;database=pharmaceutical_test;port=3306;password=test_password;"
        run: dotnet test Pharmaceutical.Tests --no-build -c Release --verbosity normal

      - name: Docker build WebAPI
        run: docker build -f Dockerfile -t pharmaceutical-webapi .

      - name: Docker build Blazor
        run: docker build -f Dockerfile.blazor -t pharmaceutical-blazor .
